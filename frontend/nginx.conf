server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin as the UI, so the backend needs no CORS config.
    # $http_host keeps the port: Spring compares it with the Origin header.
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
